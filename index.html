  <style>
  *{box-sizing: border-box;}

body{
  margin: 0;
  font-family:monospace,sans-serif, cursive;
}

@@font-face {
  font-family: 'Sacramento', cursive;
}

@@font-face {
  font-family: 'IM Fell Double Pica', serif;
}


@@font-face {
  font-family: 'DM Sans', sans-serif;
}

.header{
  overflow:hidden;
  background-color: #f1f1f1;
  padding: 20px 10px;
}

.header a{
  float: left;
  color: black;
  text-align: center;
  padding: 12px;
  text-decoration: none;
  font-size: 18px;
  line-height: 25px;
  border-radius: 4px;
}

.header a.logo{
  font-size: 25px;
  font-weight: bold;
}

.header a:hover{
  background-color: #ddd;
  color: black;
}

.header a.active{
  background-color: #95c2de;
  color: white;
}

.header-right{
  float: right;
}

/* Add a boarder */
.topnav {
display: flex;
align-items: stretch;
background-color: #95c2de;
}



/* Style the links */
.topnav a {
display: flex;
color: #f2f2f2;
text-align: center;
padding: 20px;
text-decoration: none;
font-size: 17px;
}

.topnav a:first-child {
  margin-right: auto;
}
/* Change the color of links on hover */
.topnav a:hover {
background-color: #C7EBFF;
padding: 20px;
color: #FFFFFF;
}
    
/* Add a color to the active/current link */
.topnav a.active {
background-color: #7EB4D9;
color: #FFFFFF;
}

@media screen and (max-width: 500px){
  .header a{
    float: none;
    display: block;
    text-align: left;
  }

  .header-right{
    float: none;
  }
}

.footer{
  position:fixed;
  left: 0;
  bottom: 0;
  width: 100%;
  padding: 5px;
  background-color: #95c2de;
  text-align: center;
}

.fab {
  padding: 20px;
  font-size: 30px;
  width: 30px;
  text-align: center;
  text-decoration: none;
  border-radius: 50%;
}

.fa:hover {
  opacity: 0.7;
}

.fa-linkedin {
  color: white;
}

.fa-telegram-plane {
  color: white;
}

.fa-github {
  color: white;
}

.ah{
  padding: 20px;
  font-size: 10px;
  color: white;
  text-align: left;
}
